function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.tasks)&&Array.isArray(v.sponsors)&&Array.isArray(v.experiments)&&Array.isArray(v.briefs)&&Array.isArray(v.reviews))return v;}catch(e){console.warn('Unable to load saved dashboard',e)}return seed()}
let db=load(),page='dashboard',week=0,proj='sfe',toastTimer=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){alert('Your browser could not save. Use Settings → Export backup before leaving.');}}
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function inWeek(date,i){return date>=WEEKS[i].start&&date<=WEEKS[i].end}
function done(t){return t.status==='done'}
function percentage(doneVal,total){return total?Math.round(doneVal/total*100):0}
function projectTasks(id){return db.tasks.filter(t=>t.project===id)}
function progressProject(id){let arr=projectTasks(id);return percentage(arr.filter(done).length,arr.length)}
function fmtDate(d){if(!d)return'No date';const a=d.split('-');return `${a[2]} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(a[1])-1]}`}
function weekLabel(i){return `${WEEKS[i].label} · ${WEEKS[i].range}`}
function taskHTML(t,compact=false){return `<div class="task ${compact?'compact':''} ${done(t)?'isdone':''}">${compact?'':`<input aria-label="Mark ${esc(t.title)} done" class="check" type="checkbox" data-action="toggle-task" data-id="${esc(t.id)}" ${done(t)?'checked':''}>`}<div class="task-main"><div class="task-title">${esc(t.title)}</div>${compact?'':`<div class="task-desc">${esc(t.notes)}</div>`}<div class="task-meta"><span>${esc(PROJECTS.find(p=>p.id===t.project)?.label||t.project)}</span><span>·</span><span>${esc(t.owner)}</span><span>·</span><span>${fmtDate(t.due)}</span>${t.priority==='critical'||t.priority==='high'?`<span class="pill ${t.priority}">${t.priority}</span>`:''}</div>${compact?`<select class="statussel" aria-label="Change task status" data-action="task-status" data-id="${esc(t.id)}">${['todo','doing','blocked','done'].map(x=>`<option ${x===t.status?'selected':''} value="${x}">${({todo:'To do',doing:'In progress',blocked:'Blocked',done:'Done'})[x]}</option>`).join('')}</select>`:''}</div><div class="task-actions"><button title="Edit task" aria-label="Edit task" class="iconbutton" data-action="edit-task" data-id="${esc(t.id)}">⋯</button></div></div>`}
function heading(title,sub,buttons=''){return `<div class="header"><div><div class="eyebrow">OCT–NOV 2026 · FOUR-WEEK SPRINT</div><h1 class="page-title">${title}</h1><p class="subtitle">${sub}</p></div>${buttons?`<div class="button-row">${buttons}</div>`:''}</div>`}
function button(label,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}
function renderDashboard(){let current=db.tasks.filter(t=>inWeek(t.due,week)),finished=db.tasks.filter(done),total=db.tasks.length,blockers=db.tasks.filter(t=>t.status==='blocked');const milestones=['One demonstrable customer journey','Research/clip workflow with real source citations','Two documentary creative packs','Rich Piana sponsor decision before edit lock'];return `${heading('Make the work better.','One place to run Daisy’s four-week creative and operations sprint.',button('+ New task','new-task','btn-primary'))}<div class="hero"><div><div class="eyebrow">MONTHLY MISSION</div><h2>Better documentaries. A real transformation product. Less production friction.</h2><p>Measure what ships, not how busy everyone feels. Every Friday: demonstrate the work, check impact and unblock the next step.</p></div><div class="hero-right"><div class="hero-num">${percentage(finished.length,total)}%</div><div class="small muted">tasks completed</div></div></div><div class="grid4 stats"><div class="panel stat teal"><div class="kicker">Completed tasks</div><strong>${finished.length}<span> / ${total}</span></strong><span>Across the four-week plan</span></div><div class="panel stat"><div class="kicker">This week</div><strong>${current.filter(done).length}<span> / ${current.length}</span></strong><span>${weekLabel(week)}</span></div><div class="panel stat"><div class="kicker">Blocked</div><strong style="color:${blockers.length?'var(--amber)':'var(--text)'}">${blockers.length}</strong><span>Require a decision or action</span></div><div class="panel stat"><div class="kicker">Creative packs</div><strong>${db.briefs.filter(b=>b.status==='Done').length}<span> / 2</span></strong><span>Target this month</span></div></div><div class="grid2"><div class="panel"><div class="section-head"><h2>Four strategic priorities</h2><button class="btn btn-ghost" data-page="projects">Open projects →</button></div>${PROJECTS.map(p=>`<div class="projrow"><div class="projtop"><b>${esc(p.label)}</b><span class="muted">${progressProject(p.id)}% of tasks</span></div><div class="proglabel">${p.share}% planned focus · ${esc(p.outcome)}</div><div class="progress"><i style="width:${progressProject(p.id)}%"></i></div></div>`).join('')}</div><div class="panel"><div class="section-head"><h2>${weekLabel(week)} priorities</h2><button class="btn btn-ghost" data-page="weekly">Full board →</button></div><div class="tabs">${WEEKS.map((w,i)=>`<button class="tab ${i===week?'active':''}" data-week="${i}">${w.label}</button>`).join('')}</div><div class="stack">${current.filter(t=>!done(t)).slice(0,5).map(t=>taskHTML(t)).join('')||'<div class="empty">Everything scheduled this week is finished.</div>'}</div></div></div><div class="grid2 section-division"><div class="panel"><div class="section-head"><h2>What must be true by 15 November?</h2></div><div class="stack">${milestones.map((m,i)=>`<div class="mini-item"><span class="dot"></span>${esc(m)}</div>`).join('')}</div><p class="footnote">Milestones describe desired outcomes, not claims that systems or sponsorships already exist.</p></div><div class="panel"><div class="section-head"><h2>Josh decisions needed</h2><button class="btn btn-ghost" data-page="reviews">Weekly reviews →</button></div><div class="stack">${db.reviews.map((r,i)=>r.decisions.trim()?`<div class="note"><b>${WEEKS[i].label}</b><div style="white-space:pre-wrap">${esc(r.decisions)}</div></div>`:'').filter(Boolean).join('')||'<div class="note">Use the weekly review to track decisions only Josh can make: product scope, coaching credentials, editorial calls and sponsor fit.</div>'}</div></div></div>`}
function renderWeekly(){let x=db.tasks.filter(t=>inWeek(t.due,week));let groups=[['todo','TO DO'],['doing','IN PROGRESS'],['blocked','BLOCKED'],['done','DONE']];return `${heading('Weekly delivery board','Make the week visible: every task needs an owner, deadline and definition of finished.',button('+ Add task','new-task','btn-primary'))}<div class="tabs">${WEEKS.map((w,i)=>`<button class="tab ${i===week?'active':''}" data-week="${i}">${weekLabel(i)}</button>`).join('')}</div><div class="section-head"><div><h2>${weekLabel(week)}</h2><p class="muted tiny">${x.filter(done).length} / ${x.length} tasks complete</p></div>${button('Write weekly review','open-reviews')}</div><div class="columns">${groups.map(([status,label])=>`<div class="col-board"><div class="boardtitle">${label} <span>${x.filter(t=>t.status===status).length}</span></div>${x.filter(t=>t.status===status).sort((a,b)=>a.due.localeCompare(b.due)).map(t=>taskHTML(t,true)).join('')||'<p class="muted tiny">No tasks here.</p>'}</div>`).join('')}</div><div class="panel section-division"><div class="section-head"><h2>Backlog / outside this sprint</h2></div><div class="stack">${db.tasks.filter(t=>!WEEKS.some((w,i)=>inWeek(t.due,i))).map(t=>taskHTML(t)).join('')||'<div class="muted small">No tasks outside the four-week sprint.</div>'}</div></div>`}
function renderProjects(){let chosen=PROJECTS.find(p=>p.id===proj)||PROJECTS[0],tasks=projectTasks(proj);return `${heading('Projects & ownership','Four outcomes. Clearly defined finish lines. No grab-bag responsibilities.',button('+ Add task','new-task','btn-primary'))}<div class="grid4">${PROJECTS.map(p=>`<div tabindex="0" role="button" data-project="${p.id}" class="panel project-card ${p.id===proj?'active':''}"><div style="font-size:25px;color:var(--teal)">${p.icon}</div><h3>${esc(p.label)}</h3><div class="kicker">${p.share}% planned focus</div><p>${esc(p.summary)}</p><div class="progress"><i style="width:${progressProject(p.id)}%"></i></div></div>`).join('')}</div><div class="panel section-division"><div class="section-head"><div><div class="kicker">SELECTED PROJECT</div><h2>${esc(chosen.label)}</h2></div><span class="pill">${tasks.filter(done).length}/${tasks.length} tasks</span></div><div class="note"><b>Definition of success:</b> ${esc(chosen.outcome)}</div><div class="section-division stack">${tasks.sort((a,b)=>a.due.localeCompare(b.due)).map(t=>taskHTML(t)).join('')||'<div class="empty">No tasks yet.</div>'}</div></div>`}
function renderAI(){const tests=db.experiments;return `${heading('AI workflow lab','Apify handles permitted content collection; transcription, analysis, clip search and verification are separate stages.',button('+ Add experiment','new-experiment','btn-primary'))}<div class="warn"><b>Quality gate:</b> Every claim or clip needs an original URL, timestamp and human review. Public footage is not automatically licensed for reuse. The app tracks these tests; it does not run Apify or Claude Code itself.</div><div class="grid3 stats"><div class="panel stat"><div class="kicker">Active experiments</div><strong>${tests.filter(e=>e.stage==='Testing'||e.stage==='In use').length}</strong><span>Testing or adopted</span></div><div class="panel stat teal"><div class="kicker">Verified hours saved</div><strong>${Number(tests.reduce((sum,e)=>sum+Math.max(0,(Number(e.baseline)||0)-(Number(e.after)||0)),0).toFixed(1))}h</strong><span>Per run, summing populated measurements only</span></div><div class="panel stat"><div class="kicker">Main success metric</div><strong>5h</strong><span>Net time saved per documentary, target</span></div></div><div class="ai-list">${tests.map(e=>`<div class="panel ai-card"><div><div class="kicker">${esc(e.type)} · ${esc(e.stage)}</div><h3>${esc(e.name)}</h3><p>${esc(e.notes)}</p><div class="ai-criteria"><b>Acceptance criterion:</b> ${esc(e.target)}</div><div class="button-row" style="margin-top:12px"><span class="pill">Baseline: ${e.baseline>0?`${e.baseline}h`:'Not measured'}</span><span class="pill">After: ${e.after>0?`${e.after}h`:'Not measured'}</span><span class="pill">Tests: ${e.trials||0}</span></div></div><div class="button-row" style="align-self:start"><button class="btn" data-action="edit-experiment" data-id="${esc(e.id)}">Edit experiment</button></div></div>`).join('')}</div><div class="panel section-division"><div class="section-head"><h2>The desired research pipeline</h2></div><div class="grid4">${[['1. Collect','Apify: URLs, metadata, accessible transcripts, comments'],['2. Extract','AI: facts, arguments, jokes, angles and possible footage'],['3. Verify','Tristan: timestamps, claims, missing context, original sources'],['4. Deliver','Editor: usable linked clips, research dossier, tracked time saved']].map(x=>`<div class="note"><b>${x[0]}</b><p style="margin:6px 0 0">${x[1]}</p></div>`).join('')}</div></div>`}
function renderSponsors(){return `${heading('Sponsorship pipeline','Resolve the Rich Piana slot without compromising editorial fit, then keep partner obligations predictable.',button('+ Add opportunity','new-sponsor','btn-primary'))}<div class="warn">Rich Piana sponsorship is <b>not secured</b> until a deal is confirmed. MacroFactor’s six contracted placements are existing inventory, not six additional unsold opportunities.</div><div class="panel section-division"><div class="section-head"><h2>Opportunities & active contracts</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Brand / opportunity</th><th>Video</th><th>Stage</th><th>Value</th><th>Next action</th><th></th></tr></thead><tbody>${db.sponsors.map(s=>`<tr><td><b>${esc(s.brand)}</b><div class="muted">${esc(s.owner)}${s.due?' · '+fmtDate(s.due):''}</div></td><td>${esc(s.video)}</td><td><span class="pill ${s.stage.toLowerCase()}">${esc(s.stage)}</span></td><td>${esc(s.value)||'—'}</td><td>${esc(s.next)}</td><td><button class="btn" data-action="edit-sponsor" data-id="${esc(s.id)}">Edit</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel section-division"><h2 class="title-sm">Rich Piana sponsor decision checklist</h2><div class="mini"><div class="mini-item"><span class="dot"></span>Confirm edit lock, sponsorship slot length and delivery date</div><div class="mini-item"><span class="dot"></span>Brief Nano Zebra and check warm, editorially suitable partners</div><div class="mini-item"><span class="dot"></span>Track replies, pricing and brand conflicts</div><div class="mini-item"><span class="dot"></span>Decide to close or go unsponsored before the lock date</div></div></div>`}
function renderCreative(){return `${heading('Creative pre-production','2–5 hours per documentary, spent where original visual ideas make a measurable difference.',button('+ Creative pack','new-brief','btn-primary'))}<div class="grid2">${db.briefs.map(b=>`<div class="panel"><div class="section-head"><div><div class="kicker">CREATIVE ENHANCEMENT PACK</div><h2>${esc(b.title)}</h2></div><span class="pill ${b.status.toLowerCase()==='done'?'done':''}">${esc(b.status)}</span></div><div class="kicker" style="margin-top:16px">VISUAL SCRIPT / GRAPHICS</div><p class="small muted" style="white-space:pre-line">${esc(b.visuals||'Not started')}</p><div class="kicker" style="margin-top:16px">JOSH ON-CAMERA OPPORTUNITIES</div><p class="small muted" style="white-space:pre-line">${esc(b.filming||'Not started')}</p>${validLink(b.moodboard)?`<p class="small"><a href="${esc(validLink(b.moodboard))}" target="_blank" rel="noopener noreferrer">Open moodboard ↗</a></p>`:''}<div class="button-row" style="margin-top:16px"><button class="btn" data-action="edit-brief" data-id="${esc(b.id)}">Edit creative pack</button></div></div>`).join('')}</div><div class="panel section-division"><h2 class="title-sm">What an excellent pack includes</h2><div class="grid3"><div class="note"><b>Visual identity</b><p>Moodboard, framing, archive style, useful motion graphics and visual metaphors.</p></div><div class="note"><b>Original moments</b><p>Props, demonstrations, interviews and filmable scenes that make the story distinctive.</p></div><div class="note"><b>Execution</b><p>Annotations in the working script, assets required, cost/effort and clear handoff.</p></div></div></div>`}
function renderReviews(){let r=db.reviews[week]||{wins:'',blockers:'',decisions:'',next:''};return `${heading('Weekly review','Monday: commit. Friday: demonstrate actual output. Track decisions rather than vague activity.',button('Export backup','export'))}<div class="tabs">${WEEKS.map((w,i)=>`<button class="tab ${i===week?'active':''}" data-week="${i}">${weekLabel(i)}</button>`).join('')}</div><div class="panel"><div class="section-head"><h2>Friday review · ${weekLabel(week)}</h2><span class="pill">Auto-saved on leaving a field</span></div><div class="review-grid"><div class="field"><label for="wins">Finished deliverables / wins</label><textarea id="wins" data-review="wins" placeholder="Links to actual work and evidence…">${esc(r.wins)}</textarea></div><div class="field"><label for="blockers">Blockers and risks</label><textarea id="blockers" data-review="blockers" placeholder="What cannot proceed, and why?">${esc(r.blockers)}</textarea></div><div class="field"><label for="decisions">Decisions Josh must make</label><textarea id="decisions" data-review="decisions" placeholder="Precise decisions; avoid open-ended issues…">${esc(r.decisions)}</textarea></div><div class="field"><label for="next">The next 3 priorities</label><textarea id="next" data-review="next" placeholder="Owner + deliverable + due date…">${esc(r.next)}</textarea></div></div><div class="divider"></div><div class="note">A Friday review is complete when Daisy shows the actual product design, pre-production pack or tested AI output — not just a list of hours spent.</div></div>`}
function renderSettings(){let size=encodeURIComponent(JSON.stringify(db)).length/1024;return `${heading('Settings & data','No account required. All edits are stored in this browser unless you export them.',button('Export JSON backup','export','btn-primary'))}<div class="grid2"><div class="panel"><h2 class="title-sm">Your workspace data</h2><p class="small muted">${db.tasks.length} tasks · ${db.experiments.length} AI workflows · ${db.briefs.length} creative packs · ${db.sponsors.length} sponsor records</p><p class="tiny muted">Backup size: approximately ${size.toFixed(1)} KB</p><div class="stack" style="margin-top:18px"><button class="btn" data-action="export">Download backup (.json)</button><button class="btn" data-action="export-csv">Export tasks (.csv)</button><label class="btn" style="display:block;text-align:center;cursor:pointer">Import saved backup <input type="file" id="importfile" accept=".json,application/json" style="display:none"></label><button class="btn btn-danger" data-action="reset">Reset to original sample plan</button></div></div><div class="panel"><h2 class="title-sm">Important: local storage</h2><p class="muted small">This first version works offline and stores your changes in this browser profile. It does not synchronise Josh and Daisy’s edits between computers, and GitHub doesn't store task changes.</p><div class="warn">Export a backup before switching browser, deleting site data or moving the app. A shared multi-user version would require a database and authentication.</div><div class="field" style="margin-top:18px"><label for="weeklyhours">Daisy’s weekly capacity (optional)</label><input id="weeklyhours" data-setting="weeklyHours" type="number" min="0" max="100" placeholder="Enter hours when confirmed" value="${esc(db.settings?.weeklyHours||'')}"></div><div class="field"><label for="meetings">Meeting cadence</label><input id="meetings" data-setting="weeklyMeetings" type="text" value="${esc(db.settings?.weeklyMeetings||'')}"></div></div></div><div class="panel section-division"><h2 class="title-sm">GitHub + Netlify deployment</h2><p class="small muted">The app is a static website. Keep the source in a private GitHub repo. To share the web interface, connect that repo to Netlify, which can deploy a new version whenever you push changes. This does <b>not</b> make task data collaborative. Do not put private customer data or API keys in the code.</p><div class="note">For actual Apify and Claude automation: add server-side integrations later, with authenticated accounts, usage safeguards, legal source access and keys stored as secrets.</div></div>`}
const renders={dashboard:renderDashboard,weekly:renderWeekly,projects:renderProjects,ai:renderAI,creative:renderCreative,sponsors:renderSponsors,reviews:renderReviews,settings:renderSettings};
function render(){document.querySelector('#app').innerHTML=renders[page]();document.querySelectorAll('#nav button').forEach(el=>el.classList.toggle('active',el.dataset.page===page));document.querySelector('#mobile-nav').value=page;}
function navigate(p){if(!renders[p])return;page=p;render();window.scrollTo(0,0)}

function closeModal(){document.querySelector('#modal-root').innerHTML=''}
function modal(title,fields,onSave,onDelete){let form=`<div class="modal-overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="iconbutton" aria-label="Close" data-action="close-modal">✕</button></div><form id="edit-form"><div class="form-grid">${fields.map(f=>`<div class="field" style="${f.wide?'grid-column:1/-1':''}"><label for="f_${f.name}">${esc(f.label)}</label>${f.type==='textarea'?`<textarea id="f_${f.name}" name="${f.name}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">${esc(f.value)}</textarea>`:f.type==='select'?`<select id="f_${f.name}" name="${f.name}">${f.options.map(opt=>`<option value="${esc(opt)}" ${opt===f.value?'selected':''}>${esc(f.labels?.[opt]||opt)}</option>`).join('')}</select>`:`<input id="f_${f.name}" type="${f.type||'text'}" name="${f.name}" value="${esc(f.value)}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">`}</div>`).join('')}</div><div class="modal-actions">${onDelete?'<button type="button" class="btn btn-danger" id="delete-record" style="margin-right:auto">Delete</button>':''}<button class="btn" type="button" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">Save changes</button></div></form></div></div>`;document.querySelector('#modal-root').innerHTML=form;let frm=document.querySelector('#edit-form');frm.addEventListener('submit',ev=>{ev.preventDefault();let values=Object.fromEntries(new FormData(frm).entries());onSave(values);closeModal();save();render();toast('Saved successfully')});if(onDelete)document.querySelector('#delete-record').onclick=()=>{if(confirm('Delete this item? This cannot be undone except by importing a backup.')){onDelete();closeModal();save();render();toast('Item deleted')}};}

 f('title','Documentary title',b.title,'text',{wide:true,required:true}),f('status','Stage',b.status,'select',{options:['Idea','Draft','In production','Done']}),f('moodboard','Moodboard URL (optional)',b.moodboard,'url'),f('visuals','Visual script, graphics, references',b.visuals,'textarea',{wide:true}),f('filming','Ideas for Josh to film',b.filming,'textarea',{wide:true}),f('notes','Production notes / resources',b.notes,'textarea',{wide:true})
 ],v=>{if(existing)Object.assign(item,v);else db.briefs.push({...b,...v})},existing?()=>db.briefs=db.briefs.filter(x=>x.id!==id):null)}
function download(name,content,mime){const b=new Blob([content],{type:mime});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){download('Daisy_Creative_Ops_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8')}
function exportCSV(){const head=['Title','Project','Owner','Due','Status','Priority','Estimated hours','Notes'];const vals=db.tasks.map(t=>[t.title,PROJECTS.find(p=>p.id===t.project)?.label||t.project,t.owner,t.due,t.status,t.priority,t.hours,t.notes]);const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('Daisy_Tasks.csv',[head,...vals].map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function doAction(el){let a=el.dataset.action,id=el.dataset.id;if(a==='new-task')return editTask();if(a==='edit-task')return editTask(id);if(a==='new-experiment')return editExperiment();if(a==='edit-experiment')return editExperiment(id);if(a==='new-sponsor')return editSponsor();if(a==='edit-sponsor')return editSponsor(id);if(a==='new-brief')return editBrief();if(a==='edit-brief')return editBrief(id);if(a==='close-modal')return closeModal();if(a==='open-reviews')return navigate('reviews');if(a==='export')return exportData();if(a==='export-csv')return exportCSV();if(a==='reset'){if(confirm('Reset all tasks, notes, AI measurements and sponsor records to the original example? Export a backup first.')){db=seed();save();render();toast('Reset complete')}return}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}let wk=e.target.closest('[data-week]');if(wk){setWeek(wk.dataset.week);return}let pr=e.target.closest('[data-project]');if(pr){proj=pr.dataset.project;render();return}let act=e.target.closest('[data-action]');if(act&&act.dataset.action!=='toggle-task'&&act.dataset.action!=='task-status'){doAction(act);return}if(e.target.id==='overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();let pr=e.target.closest('[data-project]');if(pr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();proj=pr.dataset.project;render()}});
document.addEventListener('change',async e=>{let x=e.target;if(x.id==='mobile-nav'){navigate(x.value);return}if(x.dataset.action==='toggle-task'){let t=db.tasks.find(t=>t.id===x.dataset.id);if(t)t.status=x.checked?'done':'todo';save();render();return}if(x.dataset.action==='task-status'){let t=db.tasks.find(t=>t.id===x.dataset.id);if(t)t.status=x.value;save();render();return}if(x.dataset.review){db.reviews[week][x.dataset.review]=x.value;save();toast('Review saved');return}if(x.dataset.setting){db.settings[x.dataset.setting]=x.value;save();toast('Setting saved');return}if(x.id==='importfile'){const file=x.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.tasks)||!Array.isArray(obj.experiments)||!Array.isArray(obj.sponsors)||!Array.isArray(obj.briefs)||!Array.isArray(obj.reviews))throw new Error('Not a valid creative operations backup');if(confirm('Import this backup? Current unsaved data will be replaced.')){db={...seed(),...obj};save();render();toast('Backup imported')}}catch(error){alert('Import failed: '+error.message)}}});
render();
</script>
